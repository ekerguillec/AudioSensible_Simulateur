name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ─── Linux : AppImage + tar.gz ───────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish linux-x64
        run: |
          dotnet publish AudioSensible.csproj \
            -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:StripSymbols=true \
            -c Release -o publish/

      - name: Install libfuse2
        run: sudo apt-get install -y libfuse2

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp publish/HearingLossSimulator AppDir/usr/bin/HearingLossSimulator
          chmod +x AppDir/usr/bin/HearingLossSimulator
          cp packaging/AppDir/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp packaging/AppDir/AudioSensible.desktop AppDir/AudioSensible.desktop
          if [ -s packaging/AppDir/AudioSensible.png ]; then
            cp packaging/AppDir/AudioSensible.png AppDir/AudioSensible.png
          else
            convert -size 256x256 xc:'#1a1a2e' -fill white -font DejaVu-Sans-Bold \
              -pointsize 48 -gravity center -annotate 0 'AS' AppDir/AudioSensible.png
          fi
          ln -sf AudioSensible.png AppDir/.DirIcon

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          NAME="AudioSensible-${{ steps.ver.outputs.version }}-x86_64.AppImage"
          appimagetool AppDir "${NAME}" || {
            appimagetool --appimage-extract
            ./squashfs-root/AppRun AppDir "${NAME}"
          }

      - name: Build tar.gz
        run: |
          tar -czf "AudioSensible-${{ steps.ver.outputs.version }}-linux-x64.tar.gz" \
            -C publish HearingLossSimulator

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            AudioSensible-${{ steps.ver.outputs.version }}-x86_64.AppImage
            AudioSensible-${{ steps.ver.outputs.version }}-linux-x64.tar.gz

  # ─── Windows : zip avec .exe ──────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME" -replace '^v',''
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish win-x64
        run: |
          dotnet publish AudioSensible.csproj `
            -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -c Release -o publish\
        shell: pwsh

      - name: Package zip
        shell: pwsh
        run: |
          $name = "AudioSensible-${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish\HearingLossSimulator.exe -DestinationPath $name

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: AudioSensible-${{ steps.ver.outputs.version }}-win-x64.zip

  # ─── macOS : x64 (Intel) + arm64 (Apple Silicon) ────────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish osx-${{ matrix.arch }}
        run: |
          dotnet publish AudioSensible.csproj \
            -r osx-${{ matrix.arch }} --self-contained true \
            -p:PublishSingleFile=true \
            -c Release -o publish/

      - name: Package tar.gz
        run: |
          tar -czf "AudioSensible-${{ steps.ver.outputs.version }}-osx-${{ matrix.arch }}.tar.gz" \
            -C publish HearingLossSimulator

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-build
          path: AudioSensible-${{ steps.ver.outputs.version }}-osx-${{ matrix.arch }}.tar.gz

  # ─── Release GitHub : agrège tous les artefacts ──────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Extract version
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "AudioSensible ${{ steps.ver.outputs.version }}"
          body: |
            ## AudioSensible ${{ steps.ver.outputs.version }}

            Simulateur de perte auditive en temps réel.

            ---

            ### 🐧 Linux
            ```bash
            chmod +x AudioSensible-${{ steps.ver.outputs.version }}-x86_64.AppImage
            ./AudioSensible-${{ steps.ver.outputs.version }}-x86_64.AppImage
            ```
            Ou avec le tar.gz :
            ```bash
            tar -xzf AudioSensible-${{ steps.ver.outputs.version }}-linux-x64.tar.gz
            ./HearingLossSimulator
            ```
            > Dépendances requises : `libasound2` (ALSA) — généralement déjà installé.

            ---

            ### 🍎 macOS
            Télécharger `osx-arm64` (Apple Silicon M1/M2/M3) ou `osx-x64` (Intel) :
            ```bash
            tar -xzf AudioSensible-${{ steps.ver.outputs.version }}-osx-arm64.tar.gz
            ./HearingLossSimulator
            ```
            > Si macOS bloque le lancement (Gatekeeper) :
            > `xattr -d com.apple.quarantine ./HearingLossSimulator`

            ---

            ### 🪟 Windows
            Extraire le `.zip` et lancer `HearingLossSimulator.exe` dans un terminal :
            ```
            HearingLossSimulator.exe
            ```
            > Aucune dépendance requise — tout est inclus.
          files: artifacts/**
